# Pinned project name so the stack is independent of the folder name (renaming the
# directory won't orphan the containers/volumes). Postgres is part of this compose
# project — `make dev` brings it up alongside rabbitmq. Data lives in the `pgdata`
# named volume. (The app's Node worker/serve, Ollama, and the Python Whisper
# transcriber run on the host by design.)
name: sumbox

services:
  postgres:
    # pgvector-enabled Postgres (superset of the stock image) so the ask feature's
    # `CREATE EXTENSION vector` migration applies. pg16 keeps the major version pinned.
    #
    # Pinned by digest, NOT just the floating `pg16` tag: the `pg16` tag is rebuilt
    # in place against newer Debian/glibc/ICU, and a glibc/ICU bump changes text
    # collation ordering. A btree index over a text column (e.g. participants'
    # (tenant_id, display_name)) built under the old collation then looks corrupt to
    # the new library — surfacing as `XX002 … overlaps with invalid duplicate tuple`
    # on the next upsert, which silently breaks message ingestion. Pinning the digest
    # freezes the OS libraries so the collation never drifts under our indexes.
    # To bump deliberately: pull the new digest, then REINDEX text indexes (or run
    # `sumbox doctor`, which now amchecks them). See ops/runbooks/collation-corruption.md.
    image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    # Credentials come from .env (see .env.example). The fallback is the legacy
    # postgres/postgres so an install whose .env predates these keys keeps working.
    # POSTGRES_PASSWORD only takes effect when the pgdata volume is first created:
    # on an existing volume, rotate it with ALTER USER (see .env.example). The user
    # stays `postgres` (the healthcheck below and the live volume both assume it).
    #
    # The keys are SUMBOX_-prefixed on purpose: docker-compose.langfuse.yml reads the
    # same root .env and has its own POSTGRES_PASSWORD, so a bare name would collide.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SUMBOX_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: whatsapp_sum
    # Loopback only: nothing outside this Mac needs the database.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_sum"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management
    # Credentials come from .env (see .env.example); the fallback is the legacy
    # guest/guest so an install whose .env predates these keys keeps working.
    # RabbitMQ creates this user whenever it boots a fresh node, and every container
    # recreate is a fresh node (the node name is the container id), so changing
    # these values takes effect on the next `docker compose up`.
    environment:
      RABBITMQ_DEFAULT_USER: ${SUMBOX_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${SUMBOX_RABBITMQ_PASSWORD:-guest}
    # Loopback only: the AMQP port and the management UI stay on this Mac.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  pgdata:
